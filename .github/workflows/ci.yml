name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          # The metrics are computed from git history, so the tests need a
          # working git — but they build their own throwaway repos, so no
          # fetch-depth beyond the default is required.
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Identify git to the runner
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Test
        run: pytest -q

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: foundry-rs/foundry-toolchain@v1

      # The fork tests replay real Base mainnet state. Cache it so CI is not
      # hammering a free public RPC on every push — that rate-limits and reads
      # as a test failure, which is how a green suite starts looking red.
      - name: Cache RPC responses
        uses: actions/cache@v4
        with:
          path: ~/.foundry/cache/rpc
          key: rpc-base-${{ hashFiles('contracts/test/*.sol') }}
          restore-keys: rpc-base-

      - name: Build (always — catches compile breaks without any RPC)
        working-directory: contracts
        run: forge build

      - name: Test
        working-directory: contracts
        env:
          FOUNDRY_RPC_ENDPOINTS_BASE: ${{ secrets.BASE_RPC_URL }}
        run: |
          # Every test forks Base. The free public endpoint 429s from shared
          # Actions IPs, which fails in a way that looks like broken contracts
          # rather than a throttled RPC — the worst kind of red, because people
          # learn to ignore it. Run for real only with a dedicated endpoint;
          # otherwise say plainly that they did not run.
          if [ -z "${FOUNDRY_RPC_ENDPOINTS_BASE}" ]; then
            echo "::warning title=Fork tests skipped::No BASE_RPC_URL secret. \
          The 13 fork tests did NOT run. Add a free Alchemy/QuickNode Base key \
          as the BASE_RPC_URL repo secret to enable them."
            exit 0
          fi
          forge test -vv
