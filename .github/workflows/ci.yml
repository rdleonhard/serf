name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The metrics are computed from git history, so the tests need a
          # working git — but they build their own throwaway repos, so no
          # fetch-depth beyond the default is required.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Identify git to the runner
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Test
        run: pytest -q
