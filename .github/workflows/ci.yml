name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          # The metrics are computed from git history, so the tests need a
          # working git — but they build their own throwaway repos, so no
          # fetch-depth beyond the default is required.
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Identify git to the runner
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Test
        run: pytest -q

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: foundry-rs/foundry-toolchain@v1

      # The fork tests replay real Base mainnet state. Cache it so CI is not
      # hammering a free public RPC on every push — that rate-limits and reads
      # as a test failure, which is how a green suite starts looking red.
      - name: Cache RPC responses
        uses: actions/cache@v4
        with:
          path: ~/.foundry/cache/rpc
          key: rpc-base-${{ hashFiles('contracts/test/*.sol') }}
          restore-keys: rpc-base-

      - name: Test
        working-directory: contracts
        env:
          # Override the public endpoint when a key is available. Without the
          # secret this falls through to foundry.toml's public URL.
          FOUNDRY_RPC_ENDPOINTS_BASE: ${{ secrets.BASE_RPC_URL }}
        run: |
          forge test -vv || {
            echo "::warning::first run failed — retrying once in case of RPC rate limiting"
            sleep 20
            forge test -vv
          }
