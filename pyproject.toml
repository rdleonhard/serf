[project]
name = "serf"
version = "0.1.0"
description = "A non-rivalrous AI boss. Reads your repo, marks the board, tells you the truth."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",       # venice backend (OpenAI-compatible)
    "anthropic>=0.69.0",  # optional A/B backend
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
serf = "serf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serf"]
